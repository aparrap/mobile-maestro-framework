name: Maestro Android

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".maestro/**"
      - "scripts/**"
      - ".github/workflows/maestro-android.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash
      - name: Add Maestro to PATH
        run: echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Download demo app
        run: ./scripts/download-theapp-assets.sh
      - name: Run Android flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r apps/android/TheApp.apk
            maestro test .maestro/flows/android
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android-artifacts
          path: |
            screenshots
            .maestro/reports
